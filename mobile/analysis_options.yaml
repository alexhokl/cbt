analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_helper/analysis_options.yaml

# The shared configuration already excludes generated protobuf code (whose
# lints are not actionable here, mirroring the gosec exclusion on the Go
# side), generated localisations, build output and the platform directories.

linter:
  rules:
    - prefer_relative_imports
