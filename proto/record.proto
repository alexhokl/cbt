syntax = "proto3";

package record;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alexhokl/cbt/proto";

// RecordService is the gRPC API served by `cbt serve`. RPCs are added here and
// registered in cmd/serve.go.
//
// Every record type and the cognitive bias vocabulary live on a single service
// rather than one service per entity: the client wrapper and the interceptor
// wiring would otherwise be duplicated for no gain, and listing across both
// record types needs a single endpoint anyway.
service RecordService {
  // ListThoughtRecords returns the user's thought records, most recent event
  // first. Filtering by challenged = false yields the day's work queue.
  rpc ListThoughtRecords(ListThoughtRecordsRequest) returns (ListThoughtRecordsResponse);
  // CreateThoughtRecord creates a record. Only the event is required: a record
  // is routinely opened in the moment and completed later.
  rpc CreateThoughtRecord(CreateThoughtRecordRequest) returns (ThoughtRecord);
  // GetThoughtRecord returns a single record by identifier.
  rpc GetThoughtRecord(GetThoughtRecordRequest) returns (ThoughtRecord);
  // UpdateThoughtRecord changes the free text columns of a record. Fields left
  // unset keep their current value.
  rpc UpdateThoughtRecord(UpdateThoughtRecordRequest) returns (ThoughtRecord);
  // ChallengeThoughtRecord records the second sitting: the alternative view
  // and the evidence for it, the re-rating of each feeling, and the biases
  // identified in each thought and how much it is still believed.
  // It stamps challenged_at so the record leaves the unchallenged queue.
  rpc ChallengeThoughtRecord(ChallengeThoughtRecordRequest) returns (ThoughtRecord);
  // DeleteThoughtRecord removes a record along with its thoughts and feelings.
  rpc DeleteThoughtRecord(DeleteThoughtRecordRequest) returns (google.protobuf.Empty);

  // AddThought attaches a further negative thought to a record.
  rpc AddThought(AddThoughtRequest) returns (ThoughtRecord);
  // UpdateThought changes the wording of a thought and, optionally, the biases
  // attached to it.
  rpc UpdateThought(UpdateThoughtRequest) returns (ThoughtRecord);
  // SetHotThought marks a thought as the strongest of its record, clearing the
  // flag from its siblings.
  rpc SetHotThought(SetHotThoughtRequest) returns (ThoughtRecord);
  // SetThoughtFactual records whether a thought was judged an accurate reading
  // of the situation. Marking one factual while it carries a bias is rejected.
  rpc SetThoughtFactual(SetThoughtFactualRequest) returns (ThoughtRecord);
  // SetThoughtEvidence records what supports a thought. It can be called at
  // any time and does not mark the record as challenged.
  rpc SetThoughtEvidence(SetThoughtEvidenceRequest) returns (ThoughtRecord);
  // DeleteThought removes a thought from its record.
  rpc DeleteThought(DeleteThoughtRequest) returns (ThoughtRecord);

  // AddFeeling attaches a rated feeling to a thought record.
  rpc AddFeeling(AddFeelingRequest) returns (ThoughtRecord);
  // AddMapFeeling attaches a rated feeling to a map of worry.
  rpc AddMapFeeling(AddMapFeelingRequest) returns (MapOfWorry);
  // DeleteFeeling removes a feeling from whichever record it belongs to.
  rpc DeleteFeeling(DeleteFeelingRequest) returns (google.protobuf.Empty);

  // ListMapsOfWorry returns the user's maps of worry, most recent event first.
  rpc ListMapsOfWorry(ListMapsOfWorryRequest) returns (ListMapsOfWorryResponse);
  // CreateMapOfWorry creates a map. Setting derived_from_id marks it as an
  // alternative reworking of an existing map, to be read alongside it.
  rpc CreateMapOfWorry(CreateMapOfWorryRequest) returns (MapOfWorry);
  // GetMapOfWorry returns a single map together with the map it was derived
  // from and any alternatives derived from it.
  rpc GetMapOfWorry(GetMapOfWorryRequest) returns (GetMapOfWorryResponse);
  // UpdateMapOfWorry changes the free text columns of a map.
  rpc UpdateMapOfWorry(UpdateMapOfWorryRequest) returns (MapOfWorry);
  // DeleteMapOfWorry removes a map along with its feelings. A map with
  // alternatives derived from it is rejected.
  rpc DeleteMapOfWorry(DeleteMapOfWorryRequest) returns (google.protobuf.Empty);

  // ListBehaviouralExperiments returns the user's behavioural experiments,
  // most recent first. Filtering by completed = false yields the experiments
  // still to be carried out.
  rpc ListBehaviouralExperiments(ListBehaviouralExperimentsRequest) returns (ListBehaviouralExperimentsResponse);
  // CreateBehaviouralExperiment creates an experiment. Only the plan is
  // required; feelings given here are the ones predicted.
  rpc CreateBehaviouralExperiment(CreateBehaviouralExperimentRequest) returns (BehaviouralExperiment);
  // GetBehaviouralExperiment returns a single experiment by identifier.
  rpc GetBehaviouralExperiment(GetBehaviouralExperimentRequest) returns (BehaviouralExperiment);
  // UpdateBehaviouralExperiment changes the free text columns of an
  // experiment without marking it completed. Fields left unset keep their
  // current value.
  rpc UpdateBehaviouralExperiment(UpdateBehaviouralExperimentRequest) returns (BehaviouralExperiment);
  // CompleteBehaviouralExperiment records the second sitting: what actually
  // happened, what was learned, how to build on it, and how each feeling was
  // actually felt. It stamps completed_at so the experiment leaves the queue.
  rpc CompleteBehaviouralExperiment(CompleteBehaviouralExperimentRequest) returns (BehaviouralExperiment);
  // DeleteBehaviouralExperiment removes an experiment along with its
  // feelings.
  rpc DeleteBehaviouralExperiment(DeleteBehaviouralExperimentRequest) returns (google.protobuf.Empty);
  // AddExperimentFeeling attaches a predicted feeling to an experiment.
  rpc AddExperimentFeeling(AddExperimentFeelingRequest) returns (BehaviouralExperiment);

  // ListPositiveDataLogs returns the user's positive data logs, the most
  // recently added to first.
  rpc ListPositiveDataLogs(ListPositiveDataLogsRequest) returns (ListPositiveDataLogsResponse);
  // CreatePositiveDataLog creates a log. Only the belief is required.
  rpc CreatePositiveDataLog(CreatePositiveDataLogRequest) returns (PositiveDataLog);
  // GetPositiveDataLog returns a single log by identifier.
  rpc GetPositiveDataLog(GetPositiveDataLogRequest) returns (PositiveDataLog);
  // UpdatePositiveDataLog rewords the beliefs of a log. Ratings are not
  // changed here; RateBeliefs appends one.
  rpc UpdatePositiveDataLog(UpdatePositiveDataLogRequest) returns (PositiveDataLog);
  // DeletePositiveDataLog removes a log along with its evidence and ratings.
  rpc DeletePositiveDataLog(DeletePositiveDataLogRequest) returns (google.protobuf.Empty);
  // AddDataLogEvidence appends a row of evidence to a log.
  rpc AddDataLogEvidence(AddDataLogEvidenceRequest) returns (PositiveDataLog);
  // DeleteDataLogEvidence removes a row of evidence and returns its log.
  rpc DeleteDataLogEvidence(DeleteDataLogEvidenceRequest) returns (PositiveDataLog);
  // RateBeliefs appends a rating of both beliefs to a log, keeping the
  // earlier ones.
  rpc RateBeliefs(RateBeliefsRequest) returns (PositiveDataLog);

  // ListBiases returns the user's cognitive bias vocabulary, ordered by name.
  rpc ListBiases(ListBiasesRequest) returns (ListBiasesResponse);
  // CreateBias adds a user defined bias alongside the seeded ones.
  rpc CreateBias(CreateBiasRequest) returns (CognitiveBias);
  // RenameBias renames a user defined bias. Builtin biases are rejected.
  rpc RenameBias(RenameBiasRequest) returns (CognitiveBias);
  // DeleteBias removes a user defined bias that is no longer in use.
  rpc DeleteBias(DeleteBiasRequest) returns (google.protobuf.Empty);
}

// CognitiveBias is a named thinking error. The nine biases catalogued in the
// source material are seeded per user and marked builtin; builtins cannot be
// renamed or deleted.
message CognitiveBias {
  uint32 id = 1;
  string name = 2;
  bool is_builtin = 3;
}

// NegativeThought is a single negative automatic thought recorded against a
// thought record.
message NegativeThought {
  uint32 id = 1;
  string body = 2;
  // is_hot marks the strongest thought of the record, the one worth
  // challenging first. At most one thought per record carries it.
  bool is_hot = 3;
  // biases are the thinking errors identified in this thought. The bias
  // belongs to the thought rather than the record because each thought carries
  // its own distortion.
  repeated CognitiveBias biases = 4;
  // parent_id links this thought to the thought whose meaning it is, forming
  // the chain produced by the downward arrow technique. No RPC populates it
  // yet; the field is reserved so the chain can be recorded later.
  optional uint32 parent_id = 5;
  // is_factual records that the thought was examined and judged an accurate
  // reading of the situation rather than a distorted one. It cannot be
  // inferred from carrying no biases, because that is the state every thought
  // starts in. A thought that is factual never carries a bias.
  bool is_factual = 6;
  // belief_after is how much the thought is still believed, 0-100, given
  // during the challenge. It is absent until the thought has been re-rated.
  optional int32 belief_after = 7;
  // evidence answers "what evidence do you have that supports this thought?".
  string evidence = 8;
}

// Feeling is a single emotion rated on a 0-100 scale.
message Feeling {
  uint32 id = 1;
  string name = 2;
  // intensity_before is the rating given when the feeling was recorded.
  optional int32 intensity_before = 3;
  // intensity_after is the re-rating given during the challenge of a thought
  // record, or once a behavioural experiment has been carried out. It is
  // never set on a map of worry. On an experiment it may be set without
  // intensity_before, for a feeling that was felt but not predicted.
  optional int32 intensity_after = 4;
}

// ThoughtRecord is the thought record: event, negative thought(s), negative
// feeling(s), cognitive bias, "is there any other way I can look at this?",
// "what evidence do you have to support this alternative view?", and "how much
// do you still believe your initial thoughts? how do you feel now?".
message ThoughtRecord {
  uint32 id = 1;
  string event = 2;
  // occurred_at is when the event happened, which is frequently not when the
  // record was typed. It is absent when the user did not say.
  optional google.protobuf.Timestamp occurred_at = 3;
  string alternative_view = 4;
  string feelings_now = 5;
  // challenged_at is set once the second sitting has happened, and absent
  // while the record is still in the work queue.
  optional google.protobuf.Timestamp challenged_at = 6;
  repeated NegativeThought thoughts = 7;
  repeated Feeling feelings = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // evidence_for_alternative answers "what evidence do you have to support
  // this alternative view?".
  string evidence_for_alternative = 11;
}

// MapOfWorry traces a single event through to the behaviour it produced.
message MapOfWorry {
  uint32 id = 1;
  string event = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  string thoughts = 4;
  string what_these_thoughts_mean = 5;
  string physical_sensations = 6;
  string resultant_behaviour = 7;
  // derived_from_id points at the map this one reworks. The contrast between
  // the two is the therapeutic payload, so they are read side by side.
  optional uint32 derived_from_id = 8;
  repeated Feeling feelings = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// BehaviouralExperiment is the thought record for behavioural experiments:
// "what are you going to try?", "what do you predict will happen and how will
// you feel?", "what actually happened?", "what have you learned from this?",
// and "how can you build on this?".
message BehaviouralExperiment {
  uint32 id = 1;
  string plan = 2;
  // occurred_at is when the experiment is, or was, carried out. It is absent
  // when the user did not say.
  optional google.protobuf.Timestamp occurred_at = 3;
  string prediction = 4;
  string outcome = 5;
  string learned = 6;
  string build_on = 7;
  // completed_at is set once the outcome has been recorded, and absent while
  // the experiment is still to be carried out.
  optional google.protobuf.Timestamp completed_at = 8;
  // feelings are rated before (predicted) and after (actually felt).
  repeated Feeling feelings = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// PositiveDataLog is the positive data log: a self-critical belief, an
// alternative belief, how strongly each is believed over time, and the
// evidence that supports the alternative and weakens the old belief.
message PositiveDataLog {
  uint32 id = 1;
  string belief = 2;
  string alternative_belief = 3;
  // evidence is in the order it was written down.
  repeated DataLogEvidence evidence = 4;
  // ratings are oldest first. Each return to the log appends one.
  repeated BeliefRating ratings = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// DataLogEvidence is a single row of evidence in a positive data log.
message DataLogEvidence {
  uint32 id = 1;
  string body = 2;
  // noted_at is when the evidence happened. It is absent when the user did
  // not say.
  optional google.protobuf.Timestamp noted_at = 3;
  google.protobuf.Timestamp created_at = 4;
}

// BeliefRating is how strongly each belief was held at one sitting, 0-100.
// Either may be absent, but not both.
message BeliefRating {
  uint32 id = 1;
  google.protobuf.Timestamp rated_at = 2;
  optional int32 belief_percent = 3;
  optional int32 alternative_percent = 4;
}

// DataLogEvidenceInput is a row of evidence as supplied by the client.
message DataLogEvidenceInput {
  string body = 1;
  optional google.protobuf.Timestamp noted_at = 2;
}

// FeelingInput is a feeling as supplied by the client: a name and an optional
// 0-100 rating.
message FeelingInput {
  string name = 1;
  optional int32 intensity = 2;
}

// ThoughtInput is a negative automatic thought as supplied by the client.
message ThoughtInput {
  string body = 1;
  bool is_hot = 2;
  // biases must already exist. A bias is a vocabulary term rather than a free
  // tag, so an unrecognised name is reported as a typo rather than coined.
  repeated string biases = 3;
  // evidence is what supports the thought. It is optional.
  string evidence = 4;
}

message ListThoughtRecordsRequest {
  // challenged filters by whether the record has been challenged. Absent
  // returns both; false is the day's work queue.
  optional bool challenged = 1;
  // since restricts the listing to records whose event occurred on or after
  // this instant.
  optional google.protobuf.Timestamp since = 2;
  // search matches the event, the alternative view, the evidence for it, and
  // the thought bodies and the evidence for them.
  string search = 3;
}

message ListThoughtRecordsResponse {
  repeated ThoughtRecord records = 1;
}

message CreateThoughtRecordRequest {
  string event = 1;
  optional google.protobuf.Timestamp occurred_at = 2;
  string alternative_view = 3;
  string feelings_now = 4;
  repeated ThoughtInput thoughts = 5;
  repeated FeelingInput feelings = 6;
  string evidence_for_alternative = 7;
}

message GetThoughtRecordRequest {
  uint32 id = 1;
}

message UpdateThoughtRecordRequest {
  uint32 id = 1;
  // Unset fields keep their current value, which is what allows a record to be
  // completed one column at a time.
  optional string event = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  // clear_occurred_at distinguishes "leave the event time alone" from "forget
  // when it happened", which an absent occurred_at alone cannot express.
  bool clear_occurred_at = 4;
  optional string alternative_view = 5;
  optional string feelings_now = 6;
  optional string evidence_for_alternative = 7;
}

// ThoughtJudgement is the outcome of examining one thought during the
// challenge: which distortions it carries, or that it carries none because the
// thought was an accurate reading of the situation.
message ThoughtJudgement {
  uint32 thought_id = 1;
  // biases replaces whatever the thought carried, so re-running a challenge
  // with a corrected list leaves the corrected list. Leaving it unset keeps
  // the existing biases, so a judgement can record only that a thought is
  // factual; setting it to an empty list detaches them all.
  optional BiasNames biases = 2;
  // is_factual records whether the thought was judged an accurate reading.
  // Leaving it unset keeps the existing judgement, so a judgement can carry
  // only a belief rating. Marking a thought factual while it still carries a
  // bias is rejected.
  optional bool is_factual = 3;
  // belief_after is how much the thought is still believed, 0-100. Leaving
  // it unset keeps the existing rating.
  optional int32 belief_after = 4;
}

// FeelingRerating is the post-challenge rating of one feeling.
message FeelingRerating {
  uint32 feeling_id = 1;
  int32 intensity_after = 2;
}

message ChallengeThoughtRecordRequest {
  uint32 id = 1;
  string alternative_view = 2;
  string feelings_now = 3;
  repeated FeelingRerating feeling_reratings = 4;
  repeated ThoughtJudgement thoughts = 5;
  string evidence_for_alternative = 6;
}

message DeleteThoughtRecordRequest {
  uint32 id = 1;
}

message AddThoughtRequest {
  uint32 record_id = 1;
  ThoughtInput thought = 2;
}

message UpdateThoughtRequest {
  uint32 id = 1;
  string body = 2;
  // biases replaces the biases on the thought when set. Leaving it unset keeps
  // the existing biases, so the wording can be corrected without redoing the
  // bias work; setting it to an empty list detaches them all.
  optional BiasNames biases = 3;
}

// BiasNames wraps a repeated field so that "not given" can be told apart from
// "given as empty". proto3 cannot mark a repeated field optional.
message BiasNames {
  repeated string names = 1;
}

message SetHotThoughtRequest {
  uint32 id = 1;
}

message SetThoughtFactualRequest {
  uint32 id = 1;
  bool factual = 2;
}

message SetThoughtEvidenceRequest {
  uint32 id = 1;
  // evidence replaces whatever the thought carried; empty blanks it.
  string evidence = 2;
}

message DeleteThoughtRequest {
  uint32 id = 1;
}

message AddFeelingRequest {
  uint32 record_id = 1;
  FeelingInput feeling = 2;
}

message AddMapFeelingRequest {
  uint32 map_id = 1;
  FeelingInput feeling = 2;
}

message DeleteFeelingRequest {
  uint32 id = 1;
}

message ListMapsOfWorryRequest {
  optional google.protobuf.Timestamp since = 1;
  string search = 2;
}

message ListMapsOfWorryResponse {
  repeated MapOfWorry maps = 1;
}

message CreateMapOfWorryRequest {
  string event = 1;
  optional google.protobuf.Timestamp occurred_at = 2;
  string thoughts = 3;
  string what_these_thoughts_mean = 4;
  string physical_sensations = 5;
  string resultant_behaviour = 6;
  optional uint32 derived_from_id = 7;
  repeated FeelingInput feelings = 8;
}

message GetMapOfWorryRequest {
  uint32 id = 1;
}

// GetMapOfWorryResponse carries the map together with the maps it should be
// read against: the one it reworks, and the reworkings of it.
message GetMapOfWorryResponse {
  MapOfWorry map = 1;
  // derived_from is the map this one reworks, when it is an alternative.
  optional MapOfWorry derived_from = 2;
  // alternatives are the maps derived from this one.
  repeated MapOfWorry alternatives = 3;
}

message UpdateMapOfWorryRequest {
  uint32 id = 1;
  optional string event = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  bool clear_occurred_at = 4;
  optional string thoughts = 5;
  optional string what_these_thoughts_mean = 6;
  optional string physical_sensations = 7;
  optional string resultant_behaviour = 8;
}

message DeleteMapOfWorryRequest {
  uint32 id = 1;
}

message ListBehaviouralExperimentsRequest {
  // completed filters by whether the outcome has been recorded. Absent
  // returns both; false is the queue of experiments still to be carried out.
  optional bool completed = 1;
  optional google.protobuf.Timestamp since = 2;
  // search matches every column of the experiment.
  string search = 3;
}

message ListBehaviouralExperimentsResponse {
  repeated BehaviouralExperiment experiments = 1;
}

message CreateBehaviouralExperimentRequest {
  string plan = 1;
  optional google.protobuf.Timestamp occurred_at = 2;
  string prediction = 3;
  // feelings are the ones predicted, rated before the experiment.
  repeated FeelingInput feelings = 4;
}

message GetBehaviouralExperimentRequest {
  uint32 id = 1;
}

message UpdateBehaviouralExperimentRequest {
  uint32 id = 1;
  optional string plan = 2;
  optional google.protobuf.Timestamp occurred_at = 3;
  bool clear_occurred_at = 4;
  optional string prediction = 5;
  optional string outcome = 6;
  optional string learned = 7;
  optional string build_on = 8;
}

message CompleteBehaviouralExperimentRequest {
  uint32 id = 1;
  string outcome = 2;
  string learned = 3;
  string build_on = 4;
  // feeling_reratings rate the predicted feelings as they were actually felt.
  repeated FeelingRerating feeling_reratings = 5;
  // new_feelings are feelings that were felt but not predicted. Their
  // intensity is stored as intensity_after.
  repeated FeelingInput new_feelings = 6;
}

message DeleteBehaviouralExperimentRequest {
  uint32 id = 1;
}

message AddExperimentFeelingRequest {
  uint32 experiment_id = 1;
  FeelingInput feeling = 2;
}

message ListPositiveDataLogsRequest {
  // search matches both beliefs and every row of evidence.
  string search = 1;
}

message ListPositiveDataLogsResponse {
  repeated PositiveDataLog logs = 1;
}

message CreatePositiveDataLogRequest {
  string belief = 1;
  string alternative_belief = 2;
  // belief_percent and alternative_percent form the first rating. It is
  // stored when either is given.
  optional int32 belief_percent = 3;
  optional int32 alternative_percent = 4;
  repeated DataLogEvidenceInput evidence = 5;
}

message GetPositiveDataLogRequest {
  uint32 id = 1;
}

message UpdatePositiveDataLogRequest {
  uint32 id = 1;
  optional string belief = 2;
  optional string alternative_belief = 3;
}

message DeletePositiveDataLogRequest {
  uint32 id = 1;
}

message AddDataLogEvidenceRequest {
  uint32 log_id = 1;
  DataLogEvidenceInput evidence = 2;
}

message DeleteDataLogEvidenceRequest {
  uint32 id = 1;
}

message RateBeliefsRequest {
  uint32 log_id = 1;
  optional int32 belief_percent = 2;
  optional int32 alternative_percent = 3;
}

message ListBiasesRequest {}

message ListBiasesResponse {
  repeated CognitiveBias biases = 1;
}

message CreateBiasRequest {
  string name = 1;
}

message RenameBiasRequest {
  uint32 id = 1;
  string name = 2;
}

message DeleteBiasRequest {
  uint32 id = 1;
}
